- date: '2026-03-30'
  title: Field option management and matter listing with OData support
  breaking: false
  additions:
  - GET /fields/{fieldId}/options — list options with OData filtering and pagination
  - GET /fields/{fieldId}/options/{value} — retrieve a single option
  - POST /fields/{fieldId}/options — create a new option
  - PATCH /fields/{fieldId}/options/{value} — update an existing option
  - DELETE /fields/{fieldId}/options/{value} — delete an option
  - GET /matters — OData filtering and sorting, including by field values
- date: '2025-10-28'
  title: API V2 endpoint changes
  breaking: false
  additions:
  - $top and $skip support added to all list-based endpoints (contracttypes, mattertypes,
    fields, field options)
- date: '2025-08-04'
  title: API V2 endpoints — now generally available
  breaking: false
  highlights:
  - Simplified, more intuitive payloads
  - Improved field identifiers
  - Enhanced reference documentation
  - Improved API responses
- date: '2025-06-03'
