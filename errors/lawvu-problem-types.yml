problems:
- status: 400
  title: Bad Request
  causes:
  - Validation failures — required fields missing, invalid values, or a body that does not
    match the expected schema.
  - Malformed requests — the payload is not properly formatted (e.g. invalid JSON).
  - Business rule violations — the request violates business logic or constraints.
  remediation: Correct the request using the `errors` property when present.
  occurrences_in_spec: 17
- status: 401
  title: Unauthorized
  causes:
  - Missing Authorization header.
  - Token invalid, expired, or revoked.
  remediation: Include a valid bearer access token; refresh or re-authorize if expired.
  docs: https://api-docs.lawvu.com/docs/guides/authentication
- status: 403
  title: Forbidden
  causes:
  - Authenticated but the consenting user lacks the roles or access rights for the resource
    or action.
  remediation: Review the user's roles and permissions in LawVu.
  docs: https://help.lawvu.com/en/articles/3202052-managing-roles-and-permissions-for-your-team-members
  occurrences_in_spec: 8
- status: 404
  title: Not Found
  causes:
  - The referenced identifier or path does not correspond to an existing resource.
  occurrences_in_spec: 17
- status: 409
  title: Conflict
  causes:
  - Creating a resource that already exists.
  - An update that would violate a uniqueness constraint or conflicts with current resource
    state.
  occurrences_in_spec: 7
- status: 415
  title: Unsupported Media Type
  causes:
  - The request Content-Type is not supported by the endpoint (the API expects application/json).
  occurrences_in_spec: 1
- status: 500
  title: Internal Server Error
  causes:
  - Unexpected application error.
  remediation: Retry later; if it persists contact LawVu support and quote the `operationId`
    from the error response.
