aid: lawvu
name: LawVu
description: >-
  LawVu is a New Zealand-founded legal technology company whose LegalOS is a connected workspace
  for corporate in-house legal teams, bringing matter management, contract lifecycle management,
  legal request intake, spend management and e-billing, document management, reporting and
  embedded AI into a single platform. LawVu publishes a public REST developer platform — a v2
  API covering matters, contracts, fields and files, and a set of legacy v1 product APIs covering
  accounts, users, organisations, email threads, invoices and webhook subscriptions — secured
  with OAuth 2.0 authorization code, documented with OpenAPI 3.0.1, returning RFC 9457 problem
  details, and filtered and paged with a subset of OData. It also ships a first-party MCP server
  for connecting AI assistants to the LegalOS, a Microsoft Power Platform connector, and a
  Workato connector. LawVu is backed by Insight Partners.
