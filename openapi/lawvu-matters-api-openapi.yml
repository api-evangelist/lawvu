        description: The matter id
        required: true
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: The number of results to skip
        schema:
          type: integer
          format: int32
      - name: filtering.field
        in: query
        description: Field to filter by (optional)
        schema:
          type: string
      - name: filtering.operator
        in: query
        description: Operator used for filtering (optional)
        schema:
          enum:
          - eq
          - neq
          - lt
          - lte
          - gt
          - gte
          - startswith
          - endswith
          - contains
          - doesnotcon
          - isnull
          type: string
      - name: filtering.value
        in: query
        description: Value to filter by (optional)
        schema:
          type: string
      - name: sorting.direction
        in: query
        description: Set the sorting direction
        schema:
          enum:
          - asc
          - desc
          type: string
      - name: sorting.field
        in: query
        description: Set the sorting fields
        schema:
          type: string
      - name: take
        in: query
        description: 'The maximum number of matter users to return<p>Default: 50</p>'
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MatterUserDataSourceResult'
            application/json:
              schema:
                $ref: '#/components/schemas/MatterUserDataSourceResult'
            text/json:
              schema:
                $ref: '#/components/schemas/MatterUserDataSourceResult'
    servers:
    - url: https://api-sandbox.lawvu.com/matter-apis
      description: Sandbox API
    - url: https://api.lawvu.com/matter-apis
      description: Production API
  /v1/matters/externalid/{externalId}:
    get:
      tags:
      - Matters
      summary: ExternalId lookup
      operationId: get-v1-matters-externalid-externalid
      parameters:
      - name: externalId
