openapi: 3.2.0
info:
  title: Lawvu Matters API
  version: '1.0'
  description: 'Operations tagged Matters across 2 of this provider''s published API definitions: lawvu-api-openapi-original.yml, lawvu-matters-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-sandbox.lawvu.com
  description: Sandbox API
- url: https://api.lawvu.com
  description: Production API
- url: https://api-sandbox.lawvu.com/matter-apis
  description: Sandbox API
- url: https://api.lawvu.com/matter-apis
  description: Production API
tags:
- name: Matters
paths:
  /v2/matters:
    get:
      tags:
      - Matters
      summary: Get matters
      description: Retrieve a list of matters
      operationId: get-v2-matters
      parameters:
      - name: $filter
        in: query
        description: Filter the results using OData filter syntax
        schema:
          type: string
      - name: $orderby
        in: query
        description: Order the results using OData orderby syntax
        schema:
          type: string
      - name: $skip
        in: query
        description: Skip the specified number of results
        schema:
          type: integer
      - name: $top
        in: query
        description: Limit the number of results returned
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterCollectionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Name: Operation 'gt' is not supported for 'Name'
                instance: /matters
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
    post:
      tags:
      - Matters
      summary: Create matter
      description: Creates a matter based on the provided matter type.
      operationId: post-v2-matters
      requestBody:
        content:
          application/json:
            schema:
              required:
              - type
              allOf:
              - $ref: '#/components/schemas/CreateMatter'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Location to retrieve the created matter
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMatter'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Name: Required
                instance: /matters
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  ExternalId: Is already in use
                instance: /matters
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
    servers:
    - url: https://api-sandbox.lawvu.com
      description: Sandbox API
    - url: https://api.lawvu.com
      description: Production API
  /v2/matters/{matterId}:
    get:
      tags:
      - Matters
      summary: Get matter
      description: Retrieve a matter by its identifier
      operationId: get-v2-matters-matterid
      parameters:
      - name: matterId
        in: path
        description: The system identifier for the matter
        required: true
        schema:
          type: integer
          description: The system identifier for the matter
          format: int32
          example: 1056
        example: 1056
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /matters/1056
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    patch:
      tags:
      - Matters
      summary: Update matter
      description: Updates a matters details
      operationId: patch-v2-matters-matterid
      parameters:
      - name: matterId
        in: path
        description: The system identifier for the matter
        required: true
        schema:
          type: integer
          description: The system identifier for the matter
          format: int32
          example: 1056
        example: 1056
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateMatter'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Name: Required
                instance: /matters/1056
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: You do not have permission to update this matter
                instance: /matters/1056
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 403
                title: Forbidden
                type: https://api-docs.lawvu.com/errors/forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /matters/1056
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  ExternalId: Is already in use
                instance: /matters/1056
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
    servers:
    - url: https://api-sandbox.lawvu.com
      description: Sandbox API
    - url: https://api.lawvu.com
      description: Production API
  /v2/matters/{matterId}/files/{fileId}:
    get:
      tags:
      - Matters
      summary: Get matter file
      description: Retrieve information about a file on a matter
      operationId: get-v2-matters-matterid-files-fileid
      parameters:
      - name: matterId
        in: path
        description: The system identifier for the matter
        required: true
        schema:
          type: integer
          description: The system identifier for the matter
          format: int32
          example: 1056
        example: 1056
      - name: fileId
        in: path
        description: The system identifier for the file
        required: true
        schema:
          type: integer
          description: The system identifier for the file
          format: int32
          example: 9456
        example: 9456
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /matters/1056/files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    servers:
    - url: https://api-sandbox.lawvu.com
      description: Sandbox API
    - url: https://api.lawvu.com
      description: Production API
  /v2/matterTypes:
    get:
      tags:
      - Matters
      summary: Get matter types
      description: Retrieve a list of matter types
      operationId: get-v2-mattertypes
      parameters:
      - name: $skip
        in: query
        description: Specifies the number of items to skip
        schema:
          type: integer
          description: Specifies the number of items to skip
          format: int32
          default: 0
      - name: $top
        in: query
        description: Specifies the maximum number of items to return
        schema:
          type: integer
          description: Specifies the maximum number of items to return
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTypeCollectionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                instance: /matterTypes/
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
    servers:
    - url: https://api-sandbox.lawvu.com
      description: Sandbox API
    - url: https://api.lawvu.com
      description: Production API
  /v1/matters/quickfind:
    get:
      tags:
      - Matters
      summary: Find matters
      description: Quickly find and filter matters
      operationId: get-v1-matters-quickfind
      parameters:
      - name: term
        in: query
        description: A term to search matters by
        schema:
          type: string
      - name: includeRestricted
        in: query
        description: 'Include restricted matters in the search<p>Default: False</p>'
        schema:
          type: boolean
          default: false
      - name: take
        in: query
        description: 'The number of matters to return (maximum: 100, default: 20)'
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QuickFindMatterArray'
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFindMatterArray'
            text/json:
              schema:
                $ref: '#/components/schemas/QuickFindMatterArray'
    servers:
    - url: https://api-sandbox.lawvu.com/matter-apis
      description: Sandbox API
    - url: https://api.lawvu.com/matter-apis
      description: Production API
  /v1/matters/recent:
    get:
      tags:
      - Matters
      summary: Recent matters
      description: Returns recently viewed (ref:take) matters for the user
      operationId: get-v1-matters-recent
      parameters:
      - name: take
        in: query
        description: 'The maximum number of recently viewed matters to return<p>Default: 5</p>'
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RecentMatterArray'
              example:
              - id: 95
                name: My Matter
                matterNumber: LV1234-0012
                lastActivityDateUtc: '2023-12-15T20:30:00Z'
                organisationId: 1234
                managerId: C7541186-26CE-4C6C-ABFF-37FE3EF57F88
                ownerId: 08FD1ED1-627E-4CB9-8388-731227584D21
              - id: 789
                name: Another Matter
                matterNumber: LV1234-0099
                lastActivityDateUtc: '2024-01-12T10:00:00Z'
                organisationId: 1234
                managerId: null
                ownerId: BE17D7D6-721A-4F6D-B081-CAABB6D8F5B9
              - id: 684
                name: Different Matter
                matterNumber: LV1234-0054
                lastActivityDateUtc: '2023-12-10T15:30:00Z'
                organisationId: 1234
                managerId: C7541186-26CE-4C6C-ABFF-37FE3EF57F88
                ownerId: BE17D7D6-721A-4F6D-B081-CAABB6D8F5B9
            application/json:
              schema:
                $ref: '#/components/schemas/RecentMatterArray'
              example:
              - id: 95
                name: My Matter
                matterNumber: LV1234-0012
                lastActivityDateUtc: '2023-12-15T20:30:00Z'
                organisationId: 1234
                managerId: C7541186-26CE-4C6C-ABFF-37FE3EF57F88
                ownerId: 08FD1ED1-627E-4CB9-8388-731227584D21
              - id: 789
                name: Another Matter
                matterNumber: LV1234-0099
                lastActivityDateUtc: '2024-01-12T10:00:00Z'
                organisationId: 1234
                managerId: null
                ownerId: BE17D7D6-721A-4F6D-B081-CAABB6D8F5B9
              - id: 684
                name: Different Matter
                matterNumber: LV1234-0054
                lastActivityDateUtc: '2023-12-10T15:30:00Z'
                organisationId: 1234
                managerId: C7541186-26CE-4C6C-ABFF-37FE3EF57F88
                ownerId: BE17D7D6-721A-4F6D-B081-CAABB6D8F5B9
            text/json:
              schema:
                $ref: '#/components/schemas/RecentMatterArray'
              example:
              - id: 95
                name: My Matter
                matterNumber: LV1234-0012
                lastActivityDateUtc: '2023-12-15T20:30:00Z'
                organisationId: 1234
                managerId: C7541186-26CE-4C6C-ABFF-37FE3EF57F88
