      properties:
        id:
          type: integer
          description: The system identifier for the matter type
          format: int32
          nullable: true
          readOnly: true
          example: 7492
        name:
          type: string
          description: The user defined name of the matter type
          nullable: true
          example: My matter type
        parent:
          allOf:
          - $ref: '#/components/schemas/MatterTypeReference'
          description: The parent matter type
          nullable: true
      additionalProperties: false
    ResourceReference:
      type: object
      properties:
        id:
          type: integer
          description: The system identifier for the resource
          format: int32
          example: 78914
        type:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The type of the resource
          readOnly: true
          example: Contract
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        detail:
          type: string
          description: More information about the problem.
        instance:
          type: string
          description: The URI of the resource which the error relates to.
        operationId:
          type: string
          description: A unique trace identifier for the request. This should be provided when requesting support.
        status:
          type: integer
          description: The HTTP status code for the problem.
          format: int32
        title:
          type: string
          description: A short description of the error.
        type:
          type: string
          description: A URI which can be followed to find out more about the problem.
      additionalProperties: {}
    StatusMessage:
      type: object
      properties:
        message:
          type: string
          nullable: true
        createdDateUtc:
          type: string
          format: date-time
        id:
          type: integer
          format: int32
        userId:
          type: string
          nullable: true
        userFirstname:
          type: string
          nullable: true
        userLastname:
          type: string
          nullable: true
        userOrganisationId:
          type: integer
          format: int32
          nullable: true
        userOrganisationName:
          type: string
          nullable: true
        userHasPicture:
          type: boolean
        userPictureCacheId:
          type: integer
          format: int32
        role:
          enum:
          - Administrator
          - InhouseLegal
          - Contributor
          - Standard
          - External
          - MatterManager
          type: string
          description: <p>Options:</p><ul><li>Administrator</li><li>InhouseLegal</li><li>Contributor</li><li>Standard</li><li>External</li><li>MatterManager</li></ul>
        userFullName:
          type: string
          nullable: true
