          format: int32
          example: 7492
        name:
          type: string
          description: The name of the matter type
          readOnly: true
          example: NDA
      additionalProperties: false
    AssignMatterUser:
      required:
      - target
      - userId
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user
        target:
          enum:
          - Matter
          - MatterOwner
          - MatterManager
          type: string
          description: The target of the assignment (Matter, MatterOwner or MatterManager)<p>Options:</p><ul><li>Matter</li><li>MatterOwner</li><li>MatterManager</li></ul>
        note:
          type: string
          description: An optional note
          nullable: true
      additionalProperties: false
    MatterCollectionResponse:
      type: object
      properties:
        items:
          type: array
