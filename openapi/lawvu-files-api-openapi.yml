openapi: 3.2.0
info:
  title: LawVu Files API
  description: The next generation of the LawVu API.
  termsOfService: https://developer.lawvu.com/developer-terms
  contact:
    name: LawVu Developer Support Team
    url: https://developer.lawvu.com
    email: developer@lawvu.com
  version: ''
servers:
- url: https://api-sandbox.lawvu.com
  description: Sandbox API
- url: https://api.lawvu.com
  description: Production API
tags:
- name: Files
paths:
  /v2/files:
    get:
      tags:
      - Files
      summary: Get files
      description: 'Retrieve a list of file resources (File, Folder, ContractDocument)


        **Recursive behavior:**

        - When filtering by `Folder.Id` (parent folder): `recursive=false` by default (returns direct children only)

        - When no folder filter is specified: `recursive=true` by default (returns all files/folders)

        - Use the `recursive` query parameter to explicitly override these defaults


        **Examples:**

        - `GET /v2/files?$filter=Folder/Id eq 786` (direct children only)

        - `GET /v2/files?$filter=Folder/Id eq 786&recursive=true` (include nested descendants)

        - `GET /v2/files?$filter=Type eq ''Folder''` (folders only)


        **Filtering:**

        - Only a single `Folder.Id` filter is allowed per request

        - Results are automatically filtered to include only Matter and Contract file types'
      operationId: get-v2-files
      parameters:
      - name: $filter
        in: query
        description: Filter the results using OData filter syntax
        schema:
          type: string
      - name: $orderby
        in: query
        description: Order the results using OData orderby syntax
        schema:
          type: string
      - name: $skip
        in: query
        description: Skip the specified number of results
        schema:
          type: integer
      - name: $top
        in: query
        description: Limit the number of results returned
        schema:
          type: integer
      - name: recursive
        in: query
        description: Specifies if child files and folders should be returned
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollectionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  $filter: Only a single folder filter (Folder/Id) is allowed per request
                instance: /files
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
    post:
      tags:
      - Files
      summary: Create file
      description: 'Creates a file resource (File, Folder, ContractDocument).

        - File or ContractDocument upload: Use `Content-Type: multipart/form-data`

        - Folder creation: Use `Content-Type: application/json`'
      operationId: post-v2-files
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileForm'
            examples:
              Contract:
                summary: Example of a file uploaded to create a contract
                description: '**Request header**


                  `Content-Type: multipart/form-data; boundary=----Boundary7MA4YWxkTrZu0gW`'
                value: '------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="file"; filename="contract.pdf"

                  Content-Type: application/pdf


                  <Binary file contents>

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceType"


                  ContractCreation

                  ------Boundary7MA4YWxkTrZu0gW--

                  '
              Contract file:
                summary: Example of a file uploaded to a contract
                description: '**Request header**


                  `Content-Type: multipart/form-data; boundary=----Boundary7MA4YWxkTrZu0gW`'
                value: '------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="file"; filename="contract-file.pdf"

                  Content-Type: application/pdf


                  <Binary file contents>

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceType"


                  Contract

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceId"


                  5348

                  ------Boundary7MA4YWxkTrZu0gW--

                  '
              Matter file:
                summary: Example of a file uploaded to a matter
                description: '**Request header**


                  `Content-Type: multipart/form-data; boundary=----Boundary7MA4YWxkTrZu0gW`'
                value: '------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="file"; filename="matter-file.pdf"

                  Content-Type: application/pdf


                  <Binary file contents>

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceType"


                  Matter

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceId"


                  1056

                  ------Boundary7MA4YWxkTrZu0gW--

                  '
              Contract file folder:
                summary: Example of a file uploaded into a folder within a contract
                description: '**Request header**


                  `Content-Type: multipart/form-data; boundary=----Boundary7MA4YWxkTrZu0gW`'
                value: '------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="file"; filename="contract-file.pdf"

                  Content-Type: application/pdf


                  <Binary file contents>

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceType"


                  Contract

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="targetResourceId"


                  5348

                  ------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="folderId"


                  786

                  ------Boundary7MA4YWxkTrZu0gW--

                  '
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolder'
            examples:
              Matter folder:
                summary: Example of creating a folder within a matter
                value:
                  name: My Documents
                  resource:
                    type: Matter
                    id: 1056
              Contract folder:
                summary: Example of creating a folder within a contract
                value:
                  name: Legal Documents
                  resource:
                    type: Contract
                    id: 5348
              Nested folder:
                summary: Example of creating a nested folder within an existing folder
                value:
                  name: Drafts
                  folder:
                    id: 786
                  resource:
                    type: Contract
                    id: 5348
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Relative location to retrieve the created file or folder
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  TargetResourceId: Is required when adding a file to a matter
                instance: /files
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  Name: A file or folder with the same name already exists in this location
                instance: /files
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The Content-Type must be either 'multipart/form-data' for file uploads or 'application/json' for folder creation
                instance: /files
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 415
                title: Unsupported media type
                type: https://api-docs.lawvu.com/errors/unsupported_media_type
  /v2/files/{fileId}:
    get:
      tags:
      - Files
      summary: Get file
      description: Retrieve details for a file resource by identifier (File, Folder, ContractDocument)
      operationId: get-v2-files-fileid
      parameters:
      - name: fileId
        in: path
        description: The system identifier for the file
        required: true
        schema:
          type: integer
          description: The system identifier for the file
          format: int32
          example: 9456
        example: 9456
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
              examples:
                File at root:
                  summary: File located at the root of the resource
                  value:
                    id: 9456
                    name: document.txt
                    displayId: LV0001-0000123.1
                    type: File
                    folder: null
                    contentType: text/plain
                    resource:
                      id: 1056
                      type: Matter
                    restricted: false
                    size: 18139
                    version: 3
                    created:
                      dateUtc: '2024-12-25T00:00:00Z'
                      userName: api.developer@lawvu.com
                    modified:
                      dateUtc: '2024-12-26T10:30:00Z'
                      userName: api.developer@lawvu.com
                File in nested folder:
                  summary: File located in a folder within a contract
                  value:
                    id: 9456
                    name: contract.pdf
                    displayId: LV0001-0000456.1
                    type: File
                    folder:
                      id: 123
                      name: Drafts
                      folder:
                        id: 786
                        name: Legal Documents
                        folder: null
                    contentType: application/pdf
                    resource:
                      id: 5348
                      type: Contract
                    restricted: true
                    size: 245890
                    version: 1
                    created:
                      dateUtc: '2024-11-15T09:00:00Z'
                      userName: legal.team@lawvu.com
                    modified:
                      dateUtc: '2024-11-20T14:45:00Z'
                      userName: legal.team@lawvu.com
                Folder at root:
                  summary: Folder located at the root of the resource
                  value:
                    id: 786
                    name: Legal Documents
                    displayId: null
                    type: Folder
                    folder: null
                    contentType: null
                    resource:
                      id: 1056
                      type: Matter
                    restricted: false
                    size: 0
                    version: 1
                    created:
                      dateUtc: '2024-12-25T00:00:00Z'
                      userName: api.developer@lawvu.com
                    modified:
                      dateUtc: '2024-12-26T10:30:00Z'
                      userName: api.developer@lawvu.com
                Folder in nested folder:
                  summary: Folder located in a folder within a contract
                  value:
                    id: 123
                    name: Drafts
                    displayId: null
                    type: Folder
                    folder:
                      id: 786
                      name: Legal Documents
                      folder: null
                    contentType: null
                    resource:
                      id: 1056
                      type: Matter
                    restricted: false
                    size: 0
                    version: 1
                    created:
                      dateUtc: '2024-12-25T00:00:00Z'
                      userName: api.developer@lawvu.com
                    modified:
                      dateUtc: '2024-12-26T10:30:00Z'
                      userName: api.developer@lawvu.com
                Contract document:
                  summary: Contract document
                  value:
                    id: 6429
                    name: contract-document.txt
                    displayId: LV0001-0000123.1
                    type: ContractDocument
                    folder: null
                    contentType: text/plain
                    resource:
                      id: 5348
                      type: Contract
                    restricted: false
                    size: 18139
                    version: 3
                    created:
                      dateUtc: '2024-12-25T00:00:00Z'
                      userName: api.developer@lawvu.com
                    modified:
                      dateUtc: '2024-12-26T10:30:00Z'
                      userName: api.developer@lawvu.com
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    delete:
      tags:
      - Files
      summary: Delete file
      description: Delete a file resource (File, Folder, ContractDocument)
      operationId: delete-v2-files-fileid
      parameters:
      - name: fileId
        in: path
        description: The system identifier for the file
        required: true
        schema:
          type: integer
          description: The system identifier for the file
          format: int32
          example: 9456
        example: 9456
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: You do not have permission to delete this file or folder
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 403
                title: Forbidden
                type: https://api-docs.lawvu.com/errors/forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    patch:
      tags:
      - Files
      summary: Update file
      description: Update a file resource (File, Folder, ContractDocument)
      operationId: patch-v2-files-fileid
      parameters:
      - name: fileId
        in: path
        description: The system identifier for the file
        required: true
        schema:
          type: integer
          description: The system identifier for the file
          format: int32
          example: 9456
        example: 9456
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateFile'
            examples:
              Rename file or folder:
                summary: Rename a file or folder
                value:
                  name: Q4 Legal Review
              Move to folder:
                summary: Move a file or folder to another folder
                value:
                  folder:
                    id: 786
              Move to root:
                summary: Move a file or folder to the root of the resource
                value:
                  folder: null
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Folder: Target location is invalid
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: You do not have permission to update this file or folder
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 403
                title: Forbidden
                type: https://api-docs.lawvu.com/errors/forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  Name: A file with the same name already exists in the target location
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
    post:
      tags:
      - Files
      summary: Upload file version
      description: Upload a new version of a file resource (File, ContractDocument)
      operationId: post-v2-files-fileid
      parameters:
      - name: fileId
        in: path
        description: The system identifier for the file
        required: true
        schema:
          type: integer
          description: The system identifier for the file
          format: int32
          example: 9456
        example: 9456
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
            examples:
              multipart/form-data:
                summary: Example of uploading a new version of an existing file
                description: '**Request header**


                  `Content-Type: multipart/form-data; boundary=----Boundary7MA4YWxkTrZu0gW`'
                value: '------Boundary7MA4YWxkTrZu0gW

                  Content-Disposition: form-data; name="file"; filename="new-file-version.pdf"

                  Content-Type: application/pdf


                  <Binary file contents>

                  ------Boundary7MA4YWxkTrZu0gW--

                  '
            encoding:
              file:
                style: form
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Relative location to retrieve the new version of the file
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  File: File size exceeds the 50 MB limit
                instance: /files
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  Name: A file with the same name already exists in this location
                instance: /files
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
  /v2/files/{fileId}/content:
    get:
      tags:
      - Files
      summary: Get file content
      description: Retrieve the binary content of a file
      operationId: get-v2-files-fileid-content
      parameters:
      - name: fileId
        in: path
        description: The system identifier for the file
        required: true
        schema:
          type: integer
          description: The system identifier for the file
          format: int32
          example: 9456
        example: 9456
      responses:
        '200':
          description: The binary content of the file.
          headers:
            Content-Type:
              description: The content type of the file content
              schema:
                type: string
            Content-Length:
              description: The length in bytes of the file content
              schema:
                type: integer
            Content-MD5:
              description: The MD5 hash of the file content
              schema:
                type: string
            Content-Disposition:
              description: The content disposition of the file content
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /files/9456/content
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
components:
  schemas:
    ResourceType:
      enum:
      - Contract
      - Matter
      type: string
    FileCollectionResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
          description: The collection of items
      additionalProperties: false
      description: Response wrapper of a collection of items
    UserReference:
      type: object
      properties:
        email:
          type: string
          description: The email address of the user
          readOnly: true
          example: api.developer@lawvu.com
        firstName:
          type: string
          description: The first name of the user
          readOnly: true
          example: Api
        id:
          type: string
          description: The unique identifier of the user
          example: f0f1e06e-3005-4093-af7f-1934d55617e1
        lastName:
          type: string
          description: The last name of the user
          readOnly: true
          example: Developer
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationReference'
          description: The organization the user belongs to
          readOnly: true
        organizationId:
          type: integer
          description: The system identifier for the organization
          format: int32
          readOnly: true
          example: 8134
      additionalProperties: false
    OrganizationReference:
      type: object
      properties:
        id:
          type: integer
          description: The system identifier for the organization
          format: int32
          example: 8134
        name:
          type: string
          description: The name of the organization
          readOnly: true
          example: Api Development Organization
      additionalProperties: false
    FileType:
      enum:
      - File
      - Folder
      - ContractDocument
      type: string
      description: The type of file entry
    FileUploadResourceType:
      enum:
      - Matter
      - Contract
      - ContractCreation
      type: string
    FolderReference:
      type: object
      properties:
        folder:
          allOf:
          - $ref: '#/components/schemas/FolderReference'
          description: "The parent folder. \n\nThe folder will be null when the folder is at the root of the resource"
          readOnly: true
        id:
          type: integer
          description: The system identifier for the folder
          format: int32
          example: 786
        name:
          type: string
          description: The name of the folder
          readOnly: true
          example: Drafts
      additionalProperties: false
    UploadedFile:
      type: object
      properties:
        id:
          type: integer
          description: The system identifier for the file
          format: int32
          readOnly: true
          example: 9456
      additionalProperties: false
      description: Represents a file that has been uploaded
    ResourceReference:
      type: object
      properties:
        id:
          type: integer
          description: The system identifier for the resource
          format: int32
          example: 78914
        type:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The type of the resource
          readOnly: true
          example: Contract
      additionalProperties: false
    UpdateFile:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: 'The user defined name of the file resource

            For file resources with a type of file this includes the file extension'
          example: Standard NDA.docx
        folder:
          allOf:
          - $ref: '#/components/schemas/FolderReference'
          description: "The folder where the file resource is located \n\nFolder is null when the file resource is located at the root of the resource"
      additionalProperties: false
    UploadFileForm:
      required:
      - file
      - targetResourceType
      type: object
      properties:
        file:
          type:
          - string
          - 'null'
          description: The file to be uploaded
          format: binary
        targetResourceType:
          allOf:
          - $ref: '#/components/schemas/FileUploadResourceType'
          description: The type of the resource the file will be uploaded to
          example: Matter
        targetResourceId:
          type:
          - integer
          - 'null'
          description: The id of the resource the file will be uploaded to. Required unless TargetResourceType is ContractCreation
          format: int32
          example: 65436
        folderId:
          type:
          - integer
          - 'null'
          description: The parent folder id of the file. Leave null if the file is not in a folder
          format: int32
          example: 32535
      additionalProperties: false
    CreateFolder:
      required:
      - name
      - resource
      type: object
      properties:
        name:
          type: string
