            application/json:
              schema:
                $ref: '#/components/schemas/RecentContractArray'
              example:
              - id: 95
                title: My Contract
                description: 'Contract ID: 95'
                name: My Contract
                matterNumber: LV1234-0012
                contractStatus: Draft
                ownerId: 08FD1ED1-627E-4CB9-8388-731227584D21
