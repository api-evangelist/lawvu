      parameters:
      - name: take
        in: query
        description: 'The number of recently viewed contracts to return<p>Default: 5</p>'
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
