components:
  schemas:
    AuditableReference:
      type: object
      properties:
        dateUtc:
          type: string
          description: >-
            The date and time the action was performed. The date and time uses
            the ISO-8601 format and will be in UTC
          format: date-time
          readOnly: true
          example: '2024-12-25T00:00:00Z'
        userName:
          type: string
          description: The username of who performed the action
          readOnly: true
          example: api.developer@lawvu.com
      additionalProperties: false
    AuditableUserReference:
      type: object
      properties:
        dateUtc:
          type: string
          description: >-
            The date and time the action was performed. The date and time uses
            the ISO-8601 format and will be in UTC
          format: date-time
          readOnly: true
          example: '2024-12-25T00:00:00Z'
        user:
          allOf:
            - $ref: '#/components/schemas/UserReference'
          description: The user who performed the action
          nullable: true
          readOnly: true
        userName:
          type: string
          description: The username of who performed the action
          readOnly: true
          example: api.developer@lawvu.com
      additionalProperties: false
    Contract:
      type: object
      properties:
        id:
          type: integer
          description: The system identifier for the contract
          format: int32
          nullable: true
          readOnly: true
          example: 5348
        name:
          type: string
          description: The user defined name of the contract
          nullable: true
          example: My contract
        document:
          allOf:
            - $ref: '#/components/schemas/FileReference'
          description: The contract document
          nullable: true
          readOnly: true
        type:
          allOf:
            - $ref: '#/components/schemas/ContractTypeReference'
          description: The type of the contract
          nullable: true
          readOnly: true
        owner:
          allOf:
            - $ref: '#/components/schemas/UserReference'
          description: The user assigned as the owner of the contract
          nullable: true
        expiry:
          type: string
          description: >-
            The expiry date of the contract. The date and time uses the ISO-8601
            format and will be in the Local timezone of the organization
          format: date-time
          nullable: true
