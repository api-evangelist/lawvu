openapi: 3.0.1
info:
  title: LawVu API
  description: The next generation of the LawVu API.
  termsOfService: https://developer.lawvu.com/developer-terms
  contact:
    name: LawVu Developer Support Team
    url: https://developer.lawvu.com
    email: developer@lawvu.com
  version: ''
servers:
  - url: https://api-sandbox.lawvu.com
    description: Sandbox API
  - url: https://api.lawvu.com
    description: Production API
paths:
  /v2/contracts:
    get:
      tags:
        - Contracts
      summary: Get contracts
      description: Retrieve a list of contracts
      operationId: get-v2-contracts
      parameters:
        - name: $filter
          in: query
          description: Filter the results using OData filter syntax
          schema:
            type: string
        - name: $orderby
          in: query
          description: Order the results using OData orderby syntax
          schema:
            type: string
        - name: $skip
          in: query
          description: Skip the specified number of results
          schema:
            type: integer
        - name: $top
          in: query
          description: Limit the number of results returned
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCollectionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Name: Operation 'gt' is not supported for 'Name'
                instance: /contracts
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
    post:
      tags:
        - Contracts
      summary: Create contract
      description: Creates a contract based on the provided contract type.
      operationId: post-v2-contracts
      requestBody:
        content:
          application/json:
            schema:
              required:
                - type
              allOf:
                - $ref: '#/components/schemas/CreateContract'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Location to retrieve the created contract
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedContract'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Name: Required
                instance: /contracts/
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  ExternalId: Is already in use
                instance: /contracts/
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
  /v2/contracts/{contractId}:
    get:
      tags:
        - Contracts
      summary: Get contract
      description: Retrieve a contract by its identifier
      operationId: get-v2-contracts-contractid
      parameters:
        - name: contractId
          in: path
          description: The system identifier for the contract
          required: true
          schema:
            type: integer
            description: The system identifier for the contract
            format: int32
            example: 5348
          example: 5348
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /contracts/5348
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    patch:
      tags:
        - Contracts
      summary: Update contract
      description: Updates a contracts details
      operationId: patch-v2-contracts-contractid
      parameters:
        - name: contractId
          in: path
          description: The system identifier for the contract
          required: true
          schema:
            type: integer
            description: The system identifier for the contract
            format: int32
            example: 5348
          example: 5348
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateContract'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                errors:
                  Name: Required
                instance: /contracts/5348
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: You do not have permission to update this contract
                instance: /contracts/5348
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 403
                title: Forbidden
                type: https://api-docs.lawvu.com/errors/forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /contracts/5348
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The request could not be processed due to a conflict
                errors:
                  ExternalId: Is already in use
                instance: /contracts/5348
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 409
                title: Conflict
                type: https://api-docs.lawvu.com/errors/conflict
  /v2/contracts/{contractId}/files/{fileId}:
    get:
      tags:
        - Contracts
      summary: Get contract file
      description: Retrieve information about a file on a contract
      operationId: get-v2-contracts-contractid-files-fileid
      parameters:
        - name: contractId
          in: path
          description: The system identifier for the contract
          required: true
          schema:
            type: integer
            description: The system identifier for the contract
            format: int32
            example: 5348
          example: 5348
        - name: fileId
          in: path
          description: The system identifier for the file
          required: true
          schema:
            type: integer
            description: The system identifier for the file
            format: int32
            example: 9456
          example: 9456
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: The requested resource could not be found
                instance: /contracts/5348/files/9456
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
  /v2/contractTypes:
    get:
      tags:
        - Contracts
      summary: Get contract types
      description: Retrieve a list of contract types
      operationId: get-v2-contracttypes
      parameters:
        - name: $skip
          in: query
          description: Specifies the number of items to skip
          schema:
            type: integer
            description: Specifies the number of items to skip
            format: int32
            default: 0
        - name: $top
          in: query
          description: Specifies the maximum number of items to return
          schema:
            type: integer
            description: Specifies the maximum number of items to return
            format: int32
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractTypeCollectionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: The request was invalid and could not be processed
                instance: /contractsTypes/
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
  /v2/fields:
    get:
      tags:
        - Fields
      summary: Get fields
      description: Retrieve a list of available fields
      operationId: get-v2-fields
      parameters:
        - name: $skip
          in: query
          description: Specifies the number of items to skip
          schema:
            type: integer
            description: Specifies the number of items to skip
            format: int32
            default: 0
        - name: $top
          in: query
          description: Specifies the maximum number of items to return
          schema:
            type: integer
            description: Specifies the maximum number of items to return
            format: int32
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldCollectionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v2/fields/{fieldId}/options:
    get:
      tags:
        - Fields
      summary: Get field options
      description: |-
        Retrieve a list of available options for a field.

        Supported field types: MultiOption, Option
      operationId: get-v2-fields-fieldid-options
      parameters:
        - name: fieldId
          in: path
          description: The API name for the field
          required: true
          schema:
            type: string
            description: The API name for the field
            example: my_field
          example: my_field
        - name: $filter
          in: query
          description: Filter the results using OData filter syntax
          schema:
            type: string
        - name: $skip
          in: query
          description: Skip the specified number of results
          schema:
            type: integer
        - name: $top
          in: query
          description: Limit the number of results returned
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldOptionCollectionResponse'
              examples:
                Field options:
                  summary: Example of field options
                  value:
                    items:
                      - label: Option 1
                        value: option_1
                        properties: null
                      - label: Option 2
                        value: option_2
                        properties: null
                Department field options:
                  summary: Example of field options for a department field
                  value:
                    items:
                      - label: Operations
                        value: '657'
                        properties: null
                      - label: Marketing Department
                        value: '8643'
                        properties:
                          parentId: '657'
                      - label: Finance Department
                        value: '9875'
                        properties:
                          parentId: '657'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: 'Options not supported for field type: Text'
                instance: /fields/my_field
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: >-
                  Cannot retrieve options as the requested field could not be
                  found
                instance: /fields/my_field
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    post:
      tags:
        - Fields
      summary: Add an option to a field
      description: |-
        Add a an option for a field.

        Supported field types: MultiOption, Option
      operationId: post-v2-fields-fieldid-options
      parameters:
        - name: fieldId
          in: path
          description: The API name for the field
          required: true
          schema:
            type: string
            description: The API name for the field
            example: my_field
          example: my_field
      requestBody:
        content:
          application/json:
            schema:
              required:
                - label
              allOf:
                - $ref: '#/components/schemas/CreateFieldOption'
            examples:
              Create field option:
                summary: Example of creating a field option
                value:
                  label: Option 1
              Create department field option:
                summary: >-
                  Example of creating a field option for a department field with
                  a parent
                value:
                  label: Marketing Department
                  properties:
                    parentId: '657'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Location to retrieve the created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedFieldOption'
              examples:
                Created field option:
                  summary: Example of a created field option response
                  value:
                    value: option_1
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: Field does not support adding options
                instance: /fields/my_field
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: Cannot add option as the requested field could not be found
                instance: /fields/my_field
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
  /v2/fields/{fieldId}/options/{value}:
    get:
      tags:
        - Fields
      summary: Get an option for a field
      description: |-
        Retrieve an option for a field based by value

        Supported field types: MultiOption, Option
      operationId: get-v2-fields-fieldid-options-value
      parameters:
        - name: fieldId
          in: path
          description: The API name for the field
          required: true
          schema:
            type: string
            description: The API name for the field
            example: my_field
          example: my_field
        - name: value
          in: path
          description: The system generated value for the field option
          required: true
          schema:
            type: string
            description: The system generated value for the field option
            example: option_1
          example: option_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldOption'
              examples:
                Field option:
                  summary: Example of a field option
                  value:
                    label: Option 1
                    value: option_1
                    properties: null
                Department field option:
                  summary: Example of a field option for a department field
                  value:
                    label: Marketing Department
                    value: '8643'
                    properties:
                      parentId: '657'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: Field does not support options
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: You do not have permission to get this field option
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 403
                title: Forbidden
                type: https://api-docs.lawvu.com/errors/forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: Field option does not exist
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    patch:
      tags:
        - Fields
      summary: Update an option on a field
      description: |-
        Update an option on a field by value.

        Supported field types: MultiOption, Option
      operationId: patch-v2-fields-fieldid-options-value
      parameters:
        - name: fieldId
          in: path
          description: The API name for the field
          required: true
          schema:
            type: string
            description: The API name for the field
            example: my_field
          example: my_field
        - name: value
          in: path
          description: The value of the option to update
          required: true
          schema:
            type: string
          example: option_1
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateFieldOption'
            examples:
              Update field option label:
                summary: Example of updating a field option's label
                value:
                  label: Updated Label
              Update field option properties:
                summary: Example of updating a field option's properties
                value:
                  properties:
                    parentId: '657'
              Update field option label and properties:
                summary: Example of updating a field option's label and properties
                value:
                  label: Updated Department Sub
                  properties:
                    parentId: '657'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: Field does not support options
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: Field option does not exist
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
    delete:
      tags:
        - Fields
      summary: Delete an option from a field
      description: |-
        Removes an option from a field by value.

        Supported field types: MultiOption, Option
      operationId: delete-v2-fields-fieldid-options-value
      parameters:
        - name: fieldId
          in: path
          description: The API name for the field
          required: true
          schema:
            type: string
            description: The API name for the field
            example: my_field
          example: my_field
        - name: value
          in: path
          description: The system generated value for the field option
          required: true
          schema:
            type: string
            description: The system generated value for the field option
            example: option_1
          example: option_1
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
              example:
                detail: Field does not support deleting options
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 400
                title: Invalid request
                type: https://api-docs.lawvu.com/errors/invalid_request
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: You do not have permission to delete this field option
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 403
                title: Forbidden
                type: https://api-docs.lawvu.com/errors/forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                detail: Field option does not exist
                instance: /fields/my_field/options/option_1
                operationId: 7edb5d62-f5bf-463b-9410-cdd8b3293d89
                status: 404
                title: Resource not found
                type: https://api-docs.lawvu.com/errors/resource_not_found
