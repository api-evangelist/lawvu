  note: >-
    The v1 "Legacy API reference" adds domains not yet present in v2 — email threads and drafts,
    organisations, departments, regions, clients, financial settings, teams, users, webhook
    subscriptions (Account API) and invoices and invoice recipients (Invoices API).
